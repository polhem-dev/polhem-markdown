name: Build CI

# A push that changes only `.md` files starts no run; docs-check.yml checks their links. The pull_request trigger has
# no `paths-ignore`, because `build` is a required check and a required check that never starts leaves a
# documentation-only pull request waiting forever. The job recognizes such a pull request itself instead, with
# .github/scripts/detect-docs-only.sh, and ends successfully without building.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung test or restore ends the run instead of holding the runner for the default six hours.
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 2

      - name: Detect documentation-only pull request
        id: changes
        run: bash .github/scripts/detect-docs-only.sh

      - name: Setup .NET
        if: steps.changes.outputs.build == 'true'
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        if: steps.changes.outputs.build == 'true'
        run: dotnet build Polhem.Markdown.slnx --configuration Release

      - name: Test
        if: steps.changes.outputs.build == 'true'
        run: dotnet test Polhem.Markdown.slnx --configuration Release --no-build

      # The script module of the Blazor editor, tested with Node's own test runner; no npm package is involved.
      - name: Setup Node.js
        if: steps.changes.outputs.build == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24

      - name: Test the scripts
        if: steps.changes.outputs.build == 'true'
        run: node --test tests/js/*.test.mjs

  # Native AOT: publishes the smoke test, which parses a text with every kind of node the model has, with Native AOT and
  # runs it. Every AOT warning is an error, so a change that breaks AOT compatibility fails here even when the analyzers
  # of a normal build do not see it.
  aot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 2

      - name: Detect documentation-only pull request
        id: changes
        run: bash .github/scripts/detect-docs-only.sh

      - name: Setup .NET
        if: steps.changes.outputs.build == 'true'
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Publish with Native AOT
        if: steps.changes.outputs.build == 'true'
        run: dotnet publish tests/Polhem.Markdown.AotSmoke/Polhem.Markdown.AotSmoke.csproj --configuration Release --output aot-smoke

      - name: Run
        if: steps.changes.outputs.build == 'true'
        run: ./aot-smoke/Polhem.Markdown.AotSmoke

  # WebAssembly: publishes samples/MarkdownGallery.Wasm, which trims the app the way a consumer's Blazor WebAssembly app
  # is trimmed. The sample reports every trim warning in this repository's assemblies and in Markdig as an error, so a
  # change to the Blazor package that breaks under trimming fails here.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 2

      - name: Detect documentation-only pull request
        id: changes
        run: bash .github/scripts/detect-docs-only.sh

      - name: Setup .NET
        if: steps.changes.outputs.build == 'true'
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Publish trimmed
        if: steps.changes.outputs.build == 'true'
        run: dotnet publish samples/MarkdownGallery.Wasm/MarkdownGallery.Wasm.csproj --configuration Release --output wasm-gallery

  # SonarCloud analysis. It runs apart from the build job above, because the scanner wraps the build and turns warnings
  # back into warnings, so the build job stays the gate for TreatWarningsAsErrors. Settings tied to the files of this
  # repository are in SonarQube.Analysis.xml.
  #
  # The job fails when the SonarCloud quality gate fails, and repo-baseline.json in polhem-dev/.github makes it a
  # required check of `main`. The check that SonarCloud posts itself is not required instead, because it never appears
  # on a pull request that skips the analysis (one that changes only documentation, or one from a fork, which gets no
  # token); this job always starts and reports success there.
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # SonarCloud reads the history to find new code and to assign issues to authors.
          fetch-depth: 0

      - name: Detect documentation-only pull request
        id: changes
        run: bash .github/scripts/detect-docs-only.sh

      # Secrets are not passed to pull requests from forks, and the repository may not have the token yet. The analysis
      # is then skipped instead of failing the run. A documentation-only pull request skips this step too, so every
      # later step, which is gated on `enabled`, is skipped with it.
      - name: Check for the SonarCloud token
        id: token
        if: steps.changes.outputs.build == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "SONAR_TOKEN is not available, so the SonarCloud analysis is skipped."; fi

      - name: Setup .NET
        if: steps.token.outputs.enabled == 'true'
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Setup Java (for SonarScanner)
        if: steps.token.outputs.enabled == 'true'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: zulu
          java-version: '17'

      - name: Cache SonarCloud packages
        if: steps.token.outputs.enabled == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarScanner for .NET
        if: steps.token.outputs.enabled == 'true'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarScanner begin
        if: steps.token.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          dotnet sonarscanner begin
          /k:"polhem-dev_polhem-markdown"
          /o:"polhem-dev"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.qualitygate.wait=true
          /d:sonar.javascript.lcov.reportPaths="$GITHUB_WORKSPACE/TestResults/js/lcov.info"
          /s:"$GITHUB_WORKSPACE/SonarQube.Analysis.xml"

      - name: Build
        if: steps.token.outputs.enabled == 'true'
        run: dotnet build Polhem.Markdown.slnx --configuration Release --no-incremental

      - name: Test with coverage
        if: steps.token.outputs.enabled == 'true'
        # The scaling tests compare run times, which the coverage collector distorts; the build job runs them.
        run: dotnet test Polhem.Markdown.slnx --configuration Release --no-build --collect "Code Coverage;Format=xml" --results-directory TestResults/sonar --filter "Category!=Scaling"

      - name: Setup Node.js
        if: steps.token.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24

      # The coverage of the script modules under src/, as an LCOV report that "SonarScanner begin" points to. Node does
      # not create the folder of a report, so the step does. The scanner analyzes each project from its own folder, so
      # both the report's path (given to "SonarScanner begin") and the paths of the files in it must be absolute.
      - name: Test the scripts with coverage
        if: steps.token.outputs.enabled == 'true'
        run: |
          mkdir -p TestResults/js
          node --test --experimental-test-coverage --test-coverage-include='src/**' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=TestResults/js/lcov.info \
            tests/js/*.test.mjs
          sed -i "s|^SF:|SF:$GITHUB_WORKSPACE/|" TestResults/js/lcov.info
          grep '^SF:' TestResults/js/lcov.info

      - name: SonarScanner end
        if: steps.token.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
